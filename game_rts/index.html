<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Simple RTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      width:100%; height:100%; background:#0a0a12; overflow:hidden;
      font-family:'Rajdhani', system-ui, sans-serif;
      touch-action:none; user-select:none; -webkit-user-select:none;
    }

    /* ── Portrait warning ───────────────────────────── */
    #portrait-warning {
      display:none; position:fixed; inset:0; background:#0a0a12; z-index:100;
      flex-direction:column; align-items:center; justify-content:center;
      color:#fff; text-align:center; gap:16px; font-size:1.1rem;
    }
    @media (orientation:portrait) {
      #portrait-warning { display:flex; }
      #menu             { display:none; }
    }

    /* ── Background ─────────────────────────────────── */
    #bg-video {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0; pointer-events:none;
    }
    #bg-overlay {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        linear-gradient(to bottom, rgba(6,6,16,0.72) 0%, rgba(6,6,16,0.18) 40%, rgba(6,6,16,0.18) 60%, rgba(6,6,16,0.85) 100%),
        linear-gradient(to right,  rgba(6,6,16,0.60) 0%, transparent 45%, transparent 55%, rgba(6,6,16,0.55) 100%);
    }

    /* ── Stage ──────────────────────────────────────── */
    #menu {
      position:fixed; inset:0; z-index:2;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    }

    /* ── Animations ─────────────────────────────────── */
    @keyframes fadeUp    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes fadeDown  { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } }
    @keyframes fadeRight { from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }
    @keyframes fadeLeft  { from { opacity:0; transform:translateX(14px);  } to { opacity:1; transform:none; } }
    @keyframes cardIn    { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes pulse     { 0%,100% { opacity:1; } 50% { opacity:0.45; } }
    @keyframes shimmer   {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }

    /* ══════════════════════════════════════════════════
       TOP-LEFT — GAME TITLE
    ══════════════════════════════════════════════════ */
    #hud-title {
      position:absolute; top:14px; left:16px;
      animation:fadeRight 0.5s cubic-bezier(0.22,1,0.36,1) 0.08s both;
    }
    .title-eyebrow {
      font-size:8px; font-weight:700; letter-spacing:4px;
      color:rgba(255,255,255,0.32); margin-bottom:4px;
    }
    .title-main {
      font-size:52px; font-weight:900; letter-spacing:-2px;
      color:#fff; line-height:0.92;
    }
    .title-main span { color:#6be07a; }
    .title-sub {
      margin-top:7px;
      font-size:11px; font-weight:500; color:rgba(255,255,255,0.28);
      letter-spacing:0.3px;
    }
    .title-accent {
      width:36px; height:2px; border-radius:1px;
      background:#6be07a; box-shadow:0 0 8px #6be07a99;
      margin-top:8px;
      animation:fadeRight 0.5s cubic-bezier(0.22,1,0.36,1) 0.22s both;
    }

    /* ══════════════════════════════════════════════════
       TOP-RIGHT — PROFILE WIDGET
    ══════════════════════════════════════════════════ */
    #profile-widget {
      position:absolute; top:14px; right:16px; z-index:10;
      animation:fadeLeft 0.5s cubic-bezier(0.22,1,0.36,1) 0.08s both;
    }
    .pw-bar {
      display:flex; align-items:center; gap:8px;
      padding:6px 10px 6px 7px;
      background:rgba(8,8,20,0.75);
      border:1px solid rgba(255,255,255,0.09);
      border-radius:10px;
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      cursor:pointer;
      transition:border-color 0.15s, background 0.15s;
    }
    .pw-bar:hover { border-color:rgba(255,255,255,0.18); background:rgba(12,12,28,0.88); }
    .pw-avatar {
      width:26px; height:26px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,#6be07a,#3ab84a);
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:800; color:#0a1a0d;
      box-shadow:0 0 8px rgba(107,224,122,0.3);
    }
    .pw-name {
      font-size:11px; font-weight:700; letter-spacing:0.5px; color:#fff;
      max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .pw-sep { width:1px; height:14px; background:rgba(255,255,255,0.1); flex-shrink:0; }
    .pw-gold { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .pw-gold svg { width:11px; height:11px; flex-shrink:0; }
    .pw-gold-val { font-size:12px; font-weight:800; color:#ffd86b; font-variant-numeric:tabular-nums; }
    .pw-chevron {
      font-size:8px; color:rgba(255,255,255,0.3); flex-shrink:0;
      transition:transform 0.22s ease, color 0.15s; margin-left:2px;
    }
    #profile-widget.open .pw-chevron { transform:rotate(180deg); color:rgba(255,255,255,0.55); }
    .pw-dropdown {
      position:absolute; top:calc(100% + 6px); right:0;
      min-width:240px;
      background:rgba(8,8,20,0.96);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; overflow:hidden;
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      box-shadow:0 16px 48px rgba(0,0,0,0.6);
      max-height:0; opacity:0; pointer-events:none;
      transition:max-height 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.22s ease;
    }
    #profile-widget.open .pw-dropdown { max-height:280px; opacity:1; pointer-events:auto; }
    .pw-drop-inner { padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
    .pw-record-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .pw-wl { font-size:12px; font-weight:700; letter-spacing:0.5px; color:rgba(255,255,255,0.5); }
    .pw-wr { color:rgba(107,224,122,0.8); font-size:12px; font-weight:800; }
    .pw-best {
      display:flex; align-items:center; gap:5px;
      padding:3px 9px;
      background:rgba(255,216,107,0.09); border:1px solid rgba(255,216,107,0.2);
      border-radius:99px;
    }
    .pw-best-num { font-size:12px; font-weight:800; color:#ffd86b; }
    .pw-best-lbl { font-size:8px; font-weight:700; letter-spacing:1px; color:rgba(255,216,107,0.5); }
    .pw-divider { height:1px; background:rgba(255,255,255,0.07); margin:0 -14px; }
    .pw-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
    .pw-stat {
      display:flex; flex-direction:column; align-items:center; gap:2px;
      padding:6px 4px;
      background:rgba(255,255,255,0.03); border-radius:7px;
    }
    .pw-stat-val { font-size:14px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; line-height:1; }
    .pw-stat-lbl { font-size:6px; font-weight:700; letter-spacing:1.5px; color:rgba(255,255,255,0.28); text-transform:uppercase; }
    .pw-edit-btn {
      width:100%; padding:7px;
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
      border-radius:8px; color:rgba(255,255,255,0.4);
      font-size:10px; font-weight:700; letter-spacing:1px;
      cursor:pointer; font-family:inherit;
      transition:background 0.15s, color 0.15s, border-color 0.15s;
      touch-action:manipulation;
    }
    .pw-edit-btn:hover { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.2); }

    /* ══════════════════════════════════════════════════
       BOTTOM-RIGHT — ACTION PANEL
    ══════════════════════════════════════════════════ */
    #hud-actions {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom));
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.14s both;
    }

    /* ── Wave badge ── */
    .wave-badge {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 12px;
      background: rgba(8,8,20,0.72); border: 1px solid rgba(255,216,107,0.22);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 99px;
      align-self: flex-end;
    }
    .wave-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #ffd86b; box-shadow: 0 0 6px #ffd86b;
      flex-shrink: 0; animation: pulse 2s ease-in-out infinite;
    }
    .wave-text { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #ffd86b; }

    /* ── Play dropdown wrapper ── */
    .play-dropdown {
      position: relative;
      width: 220px;
    }

    /* ── Trigger button ── */
    .btn-play-trigger {
      width: 100%; padding: 14px 18px;
      background: #6be07a; color: #0a1a0d;
      font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
      border: none; border-radius: 12px;
      cursor: pointer; font-family: inherit;
      touch-action: manipulation;
      box-shadow: 0 4px 24px rgba(107,224,122,0.42);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, box-shadow 0.15s, transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }
    .btn-play-trigger:hover  { background: #7ef08b; box-shadow: 0 6px 32px rgba(107,224,122,0.56); }
    .btn-play-trigger:active { transform: scale(0.97); }
    .btn-play-trigger .chevron {
      font-size: 10px; opacity: 0.6;
      transition: transform 0.22s cubic-bezier(0.22,1,0.36,1);
    }
    .play-dropdown.open .btn-play-trigger .chevron { transform: rotate(180deg); }

    /* ── Dropdown menu ── */
    .play-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0; right: 0;
      background: rgba(8,8,20,0.96);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      /* closed state */
      opacity: 0;
      transform: translateY(6px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22,1,0.36,1);
    }
    .play-dropdown.open .play-menu {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* ── Menu items ── */
    .play-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      transition: background 0.15s;
      border: none; background: transparent;
      width: 100%; text-align: left; font-family: inherit;
    }
    .play-item + .play-item { border-top: none; }
    .play-item:hover { background: rgba(255,255,255,0.05); }
    .play-item:active { background: rgba(255,255,255,0.08); }

    .pi-icon {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .pi-icon.ai  { background: rgba(107,224,122,0.15); }
    .pi-icon.pvp { background: rgba(167,139,250,0.15); }

    .pi-text { flex: 1; }
    .pi-title {
      font-size: 14px; font-weight: 800; letter-spacing: 0.3px;
      line-height: 1; margin-bottom: 3px;
    }
    .pi-title.ai  { color: #6be07a; }
    .pi-title.pvp { color: #a78bfa; }
    .pi-desc {
      font-size: 9px; font-weight: 600; letter-spacing: 0.5px;
      color: rgba(255,255,255,0.32);
    }
    .pi-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      padding: 2px 7px; border-radius: 99px; flex-shrink: 0;
    }
    .pi-badge.wave { background: rgba(255,216,107,0.12); color: #ffd86b; border: 1px solid rgba(255,216,107,0.25); }
    .pi-badge.lan  { background: rgba(167,139,250,0.12); color: #a78bfa;  border: 1px solid rgba(167,139,250,0.25); }

    /* ── AI section groups VS AI + reset as one unit ── */
    .pi-ai-section {
      background: rgba(107,224,122,0.03);
    }
    .pi-ai-section:hover { background: rgba(107,224,122,0.05); }

    /* override individual hover on play-item inside the section */
    .pi-ai-section .play-item:hover { background: transparent; }

    /* ── Reset row inside dropdown ── */
    .pi-reset-row {
      padding: 0 16px 11px 62px;
      position: relative;
    }
    .pi-reset-row::before {
      content: '';
      position: absolute;
      left: 33px; top: 0; bottom: 11px;
      width: 1px;
      background: rgba(107,224,122,0.22);
    }
    .btn-reset-wave {
      background: none; border: none;
      color: rgba(255,255,255,0.28);
      font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
      cursor: pointer; font-family: inherit;
      padding: 3px 0 3px 6px;
      touch-action: manipulation;
      transition: color 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .btn-reset-wave:hover  { color: rgba(255,100,100,0.7); }
    .btn-reset-wave:active { color: rgba(255,100,100,0.95); }

    /* ── Explicit divider between AI section and VS PLAYER ── */
    .pi-section-divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
    }

    /* ── Manage Character button ── */
    .btn-manage {
      width: 220px; padding: 10px 14px;
      background: rgba(8,8,20,0.72);
      border: 1px solid rgba(255,216,107,0.18);
      border-radius: 12px;
      cursor: pointer; font-family: inherit;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      touch-action: manipulation;
      display: flex; align-items: center; gap: 11px;
      position: relative; overflow: hidden;
      transition: background 0.15s, border-color 0.2s, transform 0.15s;
    }
    .btn-manage::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(to bottom, #ffd86b, rgba(255,216,107,0.2));
      border-radius: 12px 0 0 12px;
    }
    .btn-manage:hover  { background: rgba(255,216,107,0.06); border-color: rgba(255,216,107,0.35); }
    .btn-manage:active { transform: scale(0.97); }

    .bm-icon {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      background: rgba(255,216,107,0.1);
      border: 1px solid rgba(255,216,107,0.2);
      display: flex; align-items: center; justify-content: center;
      color: #ffd86b;
    }
    .bm-icon svg { width: 16px; height: 16px; }
    .bm-text { flex: 1; text-align: left; }
    .bm-label {
      font-size: 8px; font-weight: 700; letter-spacing: 2px;
      color: rgba(255,216,107,0.45);
      line-height: 1; margin-bottom: 3px;
    }
    .bm-name {
      font-size: 13px; font-weight: 800; letter-spacing: 0.3px;
      color: rgba(255,255,255,0.75);
      line-height: 1;
    }
    .bm-arrow {
      font-size: 14px; color: rgba(255,216,107,0.3); flex-shrink: 0;
      transition: transform 0.15s, color 0.15s;
    }
    .btn-manage:hover .bm-arrow { transform: translateX(2px); color: rgba(255,216,107,0.6); }

    /* ── Transition ─────────────────────────────────── */
    #transition-out {
      position:fixed; inset:0; background:#0a0a12; opacity:0;
      pointer-events:none; z-index:50; transition:opacity 0.32s ease;
    }
    #transition-out.active { opacity:1; pointer-events:auto; }

    /* ── Name modal ─────────────────────────────────── */
    #name-modal {
      display:none; position:fixed; inset:0; z-index:60;
      background:rgba(0,0,0,0.72); backdrop-filter:blur(8px);
      align-items:center; justify-content:center;
    }
    #name-modal.open { display:flex; }
    .name-modal-box {
      background:rgba(10,10,22,0.98); border:1px solid rgba(255,255,255,0.12);
      border-radius:18px; padding:26px 30px;
      display:flex; flex-direction:column; gap:16px;
      min-width:280px; max-width:340px; width:88%;
      box-shadow:0 24px 80px rgba(0,0,0,0.7);
      animation:cardIn 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    .name-modal-title {
      font-size:10px; font-weight:700; letter-spacing:3px;
      color:rgba(255,255,255,0.32); text-align:center;
    }
    .name-input {
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
      border-radius:10px; padding:11px 14px; color:#fff;
      font-family:inherit; font-size:20px; font-weight:700; letter-spacing:1px;
      text-align:center; text-transform:uppercase; outline:none;
      transition:border-color 0.15s; width:100%;
    }
    .name-input:focus { border-color:#6be07a; }
    .name-input::placeholder { color:rgba(255,255,255,0.18); }
    .name-modal-btns { display:flex; gap:10px; }
    .name-confirm {
      flex:1; padding:11px; background:#6be07a; color:#0a1a0d;
      font-size:13px; font-weight:800; letter-spacing:0.5px;
      border:none; border-radius:10px; cursor:pointer; font-family:inherit;
      touch-action:manipulation; transition:background 0.15s;
    }
    .name-confirm:hover { background:#80ea8e; }
    .name-cancel {
      flex:1; padding:11px; background:transparent;
      color:rgba(255,255,255,0.32); font-size:13px; font-weight:600;
      border:1px solid rgba(255,255,255,0.1); border-radius:10px;
      cursor:pointer; font-family:inherit; touch-action:manipulation;
    }
  </style>
</head>
<body>
  <video id="bg-video" src="menu.mp4" autoplay loop muted playsinline></video>
  <div id="bg-overlay"></div>
  <div id="transition-out"></div>

  <div id="portrait-warning">
    <div style="font-size:3rem">&#8635;</div>
    <p>กรุณาหมุนหน้าจอเป็นแนวนอน</p>
  </div>

  <div id="menu">

    <!-- ═══════ TOP-LEFT: GAME TITLE ═══════ -->
    <div id="hud-title">
      <div class="title-eyebrow">REAL-TIME STRATEGY</div>
      <div class="title-main">SIMPLE<br><span>RTS</span></div>
      <div class="title-sub">ยึด spawn point ให้ได้มากที่สุด</div>
      <div class="title-accent"></div>
    </div>

    <!-- ═══════ TOP-RIGHT: PROFILE WIDGET ═══════ -->
    <div id="profile-widget">
      <div class="pw-bar" id="pw-bar">
        <div class="pw-avatar" id="pw-avatar">C</div>
        <span class="pw-name" id="pw-name">COMMANDER</span>
        <div class="pw-sep"></div>
        <div class="pw-gold">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="8.5" fill="rgba(255,216,107,0.22)" stroke="#ffd86b" stroke-width="1.5"/>
            <circle cx="10" cy="10" r="4.5"  fill="rgba(255,216,107,0.55)"/>
          </svg>
          <span class="pw-gold-val" id="pw-gold">0</span>
        </div>
        <span class="pw-chevron" id="pw-chevron">▼</span>
      </div>

      <div class="pw-dropdown" id="pw-dropdown">
        <div class="pw-drop-inner">
          <div class="pw-record-row">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="pw-wl" id="pw-record">0W 0L</span>
              <span class="pw-wr" id="pw-wr">0% WR</span>
            </div>
            <div class="pw-best">
              <span class="pw-best-num" id="pw-best">1</span>
              <span class="pw-best-lbl">BEST WAVE</span>
            </div>
          </div>
          <div class="pw-divider"></div>
          <div class="pw-stats">
            <div class="pw-stat">
              <span class="pw-stat-val" id="pw-kills">0</span>
              <span class="pw-stat-lbl">Kills</span>
            </div>
            <div class="pw-stat">
              <span class="pw-stat-val" id="pw-units">0</span>
              <span class="pw-stat-lbl">Units</span>
            </div>
            <div class="pw-stat">
              <span class="pw-stat-val" id="pw-spawns">0</span>
              <span class="pw-stat-lbl">Spawns</span>
            </div>
            <div class="pw-stat">
              <span class="pw-stat-val" id="pw-time">0m</span>
              <span class="pw-stat-lbl">Playtime</span>
            </div>
          </div>
          <div class="pw-divider"></div>
          <button class="pw-edit-btn" id="pw-edit-btn">✎ EDIT NAME</button>
        </div>
      </div>
    </div>

    <!-- ═══════ BOTTOM-RIGHT: ACTIONS ═══════ -->
    <div id="hud-actions">

      <!-- Play dropdown -->
      <div class="play-dropdown" id="play-dropdown">
        <button class="btn-play-trigger" id="btn-play-trigger">
          ▶&nbsp; PLAY
        </button>

        <div class="play-menu" id="play-menu">
          <!-- VS AI + Reset grouped -->
          <div class="pi-ai-section">
            <button class="play-item" id="btn-start">
              <div class="pi-icon ai">⚔</div>
              <div class="pi-text">
                <div class="pi-title ai">VS AI</div>
                <div class="pi-desc">ผู้เล่นคนเดียว · สู้กับ AI</div>
              </div>
              <span class="pi-badge wave" id="wave-badge-text">WAVE 1</span>
            </button>
            <div class="pi-reset-row">
              <button class="btn-reset-wave" id="btn-reset">↺ Reset to Wave 1</button>
            </div>
          </div>
          <div class="pi-section-divider"></div>
          <!-- VS PLAYER -->
          <button class="play-item" id="btn-pvp">
            <div class="pi-icon pvp">🌐</div>
            <div class="pi-text">
              <div class="pi-title pvp">VS PLAYER</div>
              <div class="pi-desc">เล่นกับเพื่อน · WiFi เดียวกัน</div>
            </div>
            <span class="pi-badge lan">LAN</span>
          </button>
        </div>
      </div>

      <!-- Manage Character button -->
      <button class="btn-manage" id="btn-manage">
        <div class="bm-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="3.5" fill="currentColor"/>
            <path d="M5 19c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M18 2v4M16 4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="bm-text">
          <div class="bm-label">UPGRADE</div>
          <div class="bm-name">Manage Character</div>
        </div>
        <span class="bm-arrow">›</span>
      </button>

    </div>

  </div>

  <!-- Name edit modal -->
  <div id="name-modal">
    <div class="name-modal-box">
      <div class="name-modal-title">COMMANDER NAME</div>
      <input class="name-input" id="name-input" maxlength="12" placeholder="ชื่อของคุณ" autocomplete="off" />
      <div class="name-modal-btns">
        <button class="name-confirm" id="name-confirm">CONFIRM</button>
        <button class="name-cancel"  id="name-cancel">CANCEL</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { loadProfile, setProfileName } from './js/profile.js';

    function _formatTime(sec) {
      if (sec < 60)   return `${sec}s`;
      if (sec < 3600) return `${Math.floor(sec / 60)}m`;
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      return m > 0 ? `${h}h ${m}m` : `${h}h`;
    }

    function renderProfile() {
      const p  = loadProfile();
      const wr = p.gamesPlayed > 0 ? Math.round(p.wins / p.gamesPlayed * 100) : 0;

      document.getElementById('pw-avatar').textContent  = p.name.charAt(0);
      document.getElementById('pw-name').textContent    = p.name;
      document.getElementById('pw-gold').textContent    = (p.gold ?? 0).toLocaleString();
      document.getElementById('pw-record').textContent  = `${p.wins}W ${p.losses}L`;
      document.getElementById('pw-wr').textContent      = `${wr}% WR`;
      document.getElementById('pw-best').textContent    = p.bestWave;
      document.getElementById('pw-kills').textContent   = p.totalKills.toLocaleString();
      document.getElementById('pw-units').textContent   = p.totalUnitsDeployed.toLocaleString();
      document.getElementById('pw-spawns').textContent  = p.totalSpawnsCaptured.toLocaleString();
      document.getElementById('pw-time').textContent    = _formatTime(p.playTimeSec);
    }

    const wave = parseInt(localStorage.getItem('rts_wave') || '1', 10);
    document.getElementById('wave-badge-text').textContent  = `WAVE ${wave}`;
    renderProfile();

    // ── Profile widget toggle ────────────────────────
    const widget   = document.getElementById('profile-widget');
    const dropdown = document.getElementById('play-dropdown');

    document.getElementById('pw-bar').addEventListener('click', e => {
      widget.classList.toggle('open');
      dropdown.classList.remove('open');
      e.stopPropagation();
    });

    // ── Play dropdown toggle ─────────────────────────
    document.getElementById('btn-play-trigger').addEventListener('click', e => {
      dropdown.classList.toggle('open');
      widget.classList.remove('open');
      e.stopPropagation();
    });

    document.addEventListener('click', e => {
      if (!widget.contains(e.target))   widget.classList.remove('open');
      if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
    });

    // ── Navigation ───────────────────────────────────
    function goTo(href, delay = 320) {
      document.getElementById('transition-out').classList.add('active');
      setTimeout(() => { location.href = href; }, delay);
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      localStorage.removeItem('pvp_mode');
      localStorage.removeItem('pvp_role');
      goTo('game.html');
    });
    document.getElementById('btn-pvp').addEventListener('click', () => {
      localStorage.setItem('pvp_mode', '1');
      localStorage.removeItem('pvp_role');
      goTo('game.html', 0);
    });
    document.getElementById('btn-manage').addEventListener('click', () => goTo('upgrade.html', 280));
    document.getElementById('btn-reset').addEventListener('click', e => {
      e.stopPropagation();
      localStorage.removeItem('rts_wave');
      document.getElementById('wave-badge-text').textContent = 'WAVE 1';
    });

    // ── Name modal ───────────────────────────────────
    const modal = document.getElementById('name-modal');
    const input = document.getElementById('name-input');

    function openNameModal() {
      input.value = loadProfile().name;
      modal.classList.add('open');
      widget.classList.remove('open');
      setTimeout(() => input.focus(), 80);
    }
    document.getElementById('pw-edit-btn').addEventListener('click', openNameModal);
    document.getElementById('name-confirm').addEventListener('click', () => {
      setProfileName(input.value);
      modal.classList.remove('open');
      renderProfile();
    });
    document.getElementById('name-cancel').addEventListener('click', () => modal.classList.remove('open'));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  document.getElementById('name-confirm').click();
      if (e.key === 'Escape') modal.classList.remove('open');
    });
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  </script>
</body>
</html>

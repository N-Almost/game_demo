<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Upgrade Units</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; background: #0a0a12; overflow: hidden;
      font-family: 'Rajdhani', system-ui, sans-serif;
      color: #fff; touch-action: none; user-select: none; -webkit-user-select: none;
    }

    @media (orientation: portrait) {
      #portrait-warning { display: flex !important; }
      #page { display: none; }
    }
    #portrait-warning {
      display: none; position: fixed; inset: 0; background: #0a0a12; z-index: 100;
      flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center; gap: 16px; font-size: 1.1rem;
    }

    /* ── Layout ──────────────────────────────────────── */
    #page {
      display: flex; flex-direction: column; height: 100%; overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────── */
    #header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      background: rgba(6,6,16,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    #btn-back {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; cursor: pointer;
      color: rgba(255,255,255,0.6); font-size: 12px; font-weight: 700;
      font-family: inherit; letter-spacing: 0.5px; touch-action: manipulation;
      transition: background 0.15s, color 0.15s;
    }
    #btn-back:hover { background: rgba(255,255,255,0.1); color: #fff; }
    #header-title {
      flex: 1; font-size: 16px; font-weight: 800; letter-spacing: 2px;
      color: rgba(255,255,255,0.88);
    }
    .gold-display {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 14px;
      background: rgba(255,216,107,0.1);
      border: 1px solid rgba(255,216,107,0.25);
      border-radius: 99px;
    }
    .gold-display svg { width: 16px; height: 16px; flex-shrink: 0; }
    .gold-display-val {
      font-size: 15px; font-weight: 800; color: #ffd86b;
      font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    }

    /* ── Unit grid ───────────────────────────────────── */
    #unit-grid {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-wrap: wrap;
      align-content: flex-start;
      gap: 12px; padding: 14px 16px;
      -webkit-overflow-scrolling: touch;
    }
    #unit-grid::-webkit-scrollbar { display: none; }

    /* ── Unit card ───────────────────────────────────── */
    .unit-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; overflow: hidden;
      flex: 1 1 260px; min-width: 240px; max-width: 340px;
      display: flex; flex-direction: column;
      animation: cardIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .card-avatar {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800;
    }
    .card-meta { flex: 1; }
    .card-name {
      font-size: 15px; font-weight: 800; letter-spacing: 1px; line-height: 1;
      margin-bottom: 4px;
    }
    .card-ability {
      display: inline-block; font-size: 8px; font-weight: 700; letter-spacing: 1px;
      padding: 2px 6px; border-radius: 3px;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5);
    }

    /* ── Upgrade rows ────────────────────────────────── */
    .upgrade-list { padding: 6px 0 8px; }

    .upgrade-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      transition: background 0.1s;
    }
    .upgrade-row:hover { background: rgba(255,255,255,0.03); }

    .upg-icon {
      width: 20px; text-align: center; font-size: 13px; flex-shrink: 0;
    }
    .upg-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
      color: rgba(255,255,255,0.5); width: 72px; flex-shrink: 0;
    }
    .upg-pips {
      display: flex; gap: 4px; flex: 1; align-items: center;
    }
    .pip {
      width: 10px; height: 10px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: transparent; transition: all 0.2s;
    }
    .pip.filled {
      background: var(--pip-color, #6be07a);
      border-color: var(--pip-color, #6be07a);
      box-shadow: 0 0 6px var(--pip-color, #6be07a);
    }
    .upg-bonus {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      color: rgba(255,255,255,0.3); width: 48px; text-align: right; flex-shrink: 0;
    }
    .upg-btn {
      padding: 5px 10px; border-radius: 7px;
      font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
      border: none; cursor: pointer; font-family: inherit;
      touch-action: manipulation; transition: all 0.15s;
      flex-shrink: 0; min-width: 52px;
    }
    .upg-btn.buyable {
      background: rgba(255,216,107,0.15);
      color: #ffd86b;
      border: 1px solid rgba(255,216,107,0.35);
    }
    .upg-btn.buyable:hover  { background: rgba(255,216,107,0.28); }
    .upg-btn.buyable:active { transform: scale(0.93); }
    .upg-btn.maxed {
      background: rgba(107,224,122,0.1);
      color: rgba(107,224,122,0.6);
      border: 1px solid rgba(107,224,122,0.2);
      cursor: default;
    }
    .upg-btn.poor {
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: default;
    }

    /* ── Transition ──────────────────────────────────── */
    #transition-out {
      position: fixed; inset: 0; background: #0a0a12;
      opacity: 0; pointer-events: none; z-index: 50;
      transition: opacity 0.28s ease;
    }
    #transition-out.active { opacity: 1; pointer-events: auto; }

    /* ── Toast ───────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: rgba(12,12,24,0.96); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 10px 20px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      color: #fff; pointer-events: none; z-index: 40;
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
      opacity: 0;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div id="portrait-warning"><p>กรุณาหมุนหน้าจอเป็นแนวนอน &#8635;</p></div>
  <div id="transition-out"></div>
  <div id="toast"></div>

  <div id="page">
    <div id="header">
      <button id="btn-back">◀ BACK</button>
      <div id="header-title">UNIT UPGRADES</div>
      <div class="gold-display">
        <svg viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="8.5" fill="rgba(255,216,107,0.2)" stroke="#ffd86b" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="4.5" fill="rgba(255,216,107,0.5)"/>
        </svg>
        <span class="gold-display-val" id="gold-val">0</span>
      </div>
    </div>
    <div id="unit-grid"></div>
  </div>

  <script type="module">
    import { loadProfile, addGold }         from './js/profile.js';
    import { UPGRADE_DEFS, MAX_LEVEL, getUnitUpgrades, buyUpgrade } from './js/upgrades.js';

    // ── Stat icons ────────────────────────────────────
    const STAT_ICONS = { hp: '❤', damage: '⚔', speed: '⚡', attackRate: '🔥' };
    const PIP_COLORS = { hp: '#6be07a', damage: '#ff8c42', speed: '#a0c4ff', attackRate: '#ffd86b' };

    let gold = 0;

    function updateGoldDisplay() {
      document.getElementById('gold-val').textContent = gold.toLocaleString();
    }

    // ── Card builder ──────────────────────────────────
    function buildCard(unit, delay) {
      const uv   = getUnitUpgrades(unit.id);
      const card = document.createElement('div');
      card.className = 'unit-card';
      card.style.animationDelay = `${delay}ms`;

      // Derive readable avatar letter and color
      const [r, g, b] = [unit.color.slice(1,3), unit.color.slice(3,5), unit.color.slice(5,7)].map(h => parseInt(h, 16));
      const avatarBg  = `rgba(${r},${g},${b},0.2)`;
      const abilityLabel = unit.ability ? unit.ability.toUpperCase() : '';

      card.innerHTML = `
        <div class="card-header">
          <div class="card-avatar" style="background:${avatarBg};color:${unit.color};border:1.5px solid ${unit.color}44">
            ${unit.name.charAt(0)}
          </div>
          <div class="card-meta">
            <div class="card-name" style="color:${unit.color}">${unit.name.toUpperCase()}</div>
            ${abilityLabel ? `<span class="card-ability">${abilityLabel}</span>` : ''}
          </div>
        </div>
        <div class="upgrade-list" id="upg-list-${unit.id}"></div>
      `;

      renderUpgradeRows(card.querySelector(`#upg-list-${unit.id}`), unit, uv);
      return card;
    }

    function renderUpgradeRows(container, unit, uv) {
      container.innerHTML = '';
      for (const [stat, def] of Object.entries(UPGRADE_DEFS)) {
        const level   = uv[stat] ?? 0;
        const maxed   = level >= MAX_LEVEL;
        const cost    = maxed ? 0 : def.costs[level];
        const canBuy  = !maxed && gold >= cost;
        const totalBonus = level * def.perLevel;
        const bonusStr = level > 0
          ? `+${Number.isInteger(totalBonus) ? totalBonus : totalBonus.toFixed(1)}${def.unit}`
          : `—`;

        const pipColor  = PIP_COLORS[stat];
        const pipsHtml  = Array.from({ length: MAX_LEVEL }, (_, i) =>
          `<span class="pip${i < level ? ' filled' : ''}" style="--pip-color:${pipColor}"></span>`
        ).join('');

        let btnHtml;
        if (maxed)      btnHtml = `<button class="upg-btn maxed" disabled>MAX</button>`;
        else if (canBuy) btnHtml = `<button class="upg-btn buyable" data-unit="${unit.id}" data-stat="${stat}">◆ ${cost}</button>`;
        else            btnHtml = `<button class="upg-btn poor" disabled>◆ ${cost}</button>`;

        const row = document.createElement('div');
        row.className = 'upgrade-row';
        row.innerHTML =
          `<span class="upg-icon">${STAT_ICONS[stat]}</span>` +
          `<span class="upg-label">${def.label}</span>` +
          `<div class="upg-pips">${pipsHtml}</div>` +
          `<span class="upg-bonus">${bonusStr}</span>` +
          btnHtml;
        container.appendChild(row);
      }
    }

    // ── Buy handler ───────────────────────────────────
    document.getElementById('unit-grid').addEventListener('click', e => {
      const btn = e.target.closest('.upg-btn.buyable');
      if (!btn) return;
      const { unit, stat } = btn.dataset;

      const cost = buyUpgrade(unit, stat, gold);
      if (cost === null) return;
      addGold(-cost);
      gold -= cost;
      updateGoldDisplay();

      // Re-render the rows for this unit card
      const uv   = getUnitUpgrades(unit);
      const list = document.getElementById(`upg-list-${unit}`);
      const u    = _units.find(u => u.id === unit);
      if (list && u) renderUpgradeRows(list, u, uv);

      showToast(`${UPGRADE_DEFS[stat].label} อัพเกรดแล้ว!`);
    });

    // ── Toast ─────────────────────────────────────────
    let _toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    // ── Back button ───────────────────────────────────
    document.getElementById('btn-back').addEventListener('click', () => {
      const out = document.getElementById('transition-out');
      out.classList.add('active');
      setTimeout(() => { location.href = 'index.html'; }, 280);
    });

    // ── Init ──────────────────────────────────────────
    let _units = [];
    (async () => {
      gold = loadProfile().gold ?? 0;
      updateGoldDisplay();

      const data = await fetch('units.json').then(r => r.json());
      _units     = data.units ?? [];
      const grid = document.getElementById('unit-grid');
      _units.forEach((u, i) => grid.appendChild(buildCard(u, i * 60)));
    })();
  </script>
</body>
</html>
